<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAZI-EATS Terminal - Campus Food Map</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css">
    <style>
        /* Map-specific styles */
        body {
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
        }

        /* Full-screen map */
        #map {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            filter: brightness(0.9) contrast(1.1);
            pointer-events: auto;
            touch-action: pan-x pan-y;
            -webkit-tap-highlight-color: transparent;
            will-change: transform;
        }

        .leaflet-tile-container,
        .leaflet-map-pane,
        .leaflet-zoom-animated {
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
            will-change: transform;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        .leaflet-container a,
        .leaflet-container button,
        .filter-pill,
        .locate-btn,
        .search-box input {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .map-search-bar::before {
            content: '> ';
            color: #00ff88;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.8);
        }

        .map-search-bar {
            padding-left: 60px;
        }

        header, footer {
            display: none;
        }

        main {
            display: none;
        }
    </style>
</head>
<body class="map-page">
    <!-- Full-screen map -->
    <div id="map"></div>

    <!-- Navigation hamburger menu -->
     <!-- Navigation hamburger menu -->
    <button class="nav-hamburger" id="navToggle" title="Menu">
        <div class="hamburger-line"></div>
        <div class="hamburger-line"></div>
        <div class="hamburger-line"></div>
    </button>

    <!-- Navigation drawer -->
    <nav class="nav-drawer" id="navDrawer">
        <div class="nav-drawer-content">
            <div class="nav-drawer-links">
                <a href="/" class="nav-drawer-link"><em>🏠</em> Home</a>
                <a href="/recipe-builder" class="nav-drawer-link"><em>👨‍🍳</em> Recipe Builder</a>
                <a href="/map" class="nav-drawer-link"><em>🗺️</em> Campus Map</a>
                <a href="/healthy" class="nav-drawer-link"><em>💪</em> Budget Meals</a>
            </div>
        </div>
    </nav>


    <!-- Navigation overlay -->
    <div class="nav-overlay" id="navOverlay"></div>

    <!-- Floating search bar -->
    <div class="map-search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="mapSearch" placeholder="search food_vendors --location campus" />
        <span class="locate-icon" id="centerBtn" title="Center map">📍</span>
    </div>

    <!-- Search results dropdown -->
    <div class="search-results" id="searchResults"></div>

    <!-- Category filter pills -->
    <div class="filter-pills" id="filterPills">
        <button class="filter-pill active" data-filter="all">[all]</button>
        <button class="filter-pill" data-filter="stores">[stores]</button>
        <button class="filter-pill" data-filter="restaurants">[restaurants]</button>
        <button class="filter-pill" data-filter="snacks">[snacks]</button>
    </div>

    <!-- Floating action buttons -->
    <div class="fab-container">
        <button class="fab" id="locateBtn" title="Your location">◉</button>
        <button class="fab" id="zoomInBtn" title="Zoom in">◇</button>
        <button class="fab" id="zoomOutBtn" title="Zoom out">◆</button>
    </div>

    <!-- Navigation tracking banner -->
    <div class="nav-banner" id="navBanner">
        <div class="nav-info">
            <div class="nav-destination" id="navDestination"></div>
            <div class="nav-details" id="navDetails"></div>
        </div>
        <button class="nav-stop-btn" id="navStopBtn">Stop</button>
    </div>

    <!-- Bottom sheet (place card) -->
    <div class="bottom-sheet" id="bottomSheet">
        <div class="sheet-handle"></div>
        <img class="sheet-image" id="sheetImage" src="" alt="Vendor image" loading="lazy" />
        <div class="sheet-content">
            <div class="sheet-header">
                <div class="sheet-title-group">
                    <div class="sheet-vendor-name" id="sheetVendorName"></div>
                    <div class="sheet-rating" id="sheetRating"></div>
                </div>
            </div>
            <div class="sheet-category" id="sheetCategory"></div>
            <div class="sheet-info-row">
                <span class="sheet-info-icon">📍</span>
                <span id="sheetLocation"></span>
            </div>
            <div class="sheet-info-row">
                <span class="sheet-info-icon">🕐</span>
                <span id="sheetHours"></span>
            </div>
            <div class="sheet-info-row">
                <span class="sheet-info-icon">💰</span>
                <span id="sheetPrice"></span>
            </div>
            <div class="sheet-info-row">
                <span class="sheet-info-icon">ℹ️</span>
                <span id="sheetDescription"></span>
            </div>
            <div class="sheet-actions">
                <button class="sheet-action-btn btn-directions" id="directionsBtn">🗺️ Get Directions</button>
                <button class="sheet-action-btn btn-share" id="shareBtn">📤 Share</button>
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Leaflet & Routing -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <!-- Map script -->
    <script src="/js/map.js"></script>

    <!-- Navigation menu script -->
    <script>
        const navToggle = document.getElementById('navToggle');
        const navDrawer = document.getElementById('navDrawer');
        const navOverlay = document.getElementById('navOverlay');
        const navLinks = document.querySelectorAll('.nav-drawer-link');

        // Toggle menu
        navToggle.addEventListener('click', () => {
            navToggle.classList.toggle('active');
            navDrawer.classList.toggle('open');
            navOverlay.classList.toggle('show');
        });

        // Close menu on overlay click
        navOverlay.addEventListener('click', () => {
            navToggle.classList.remove('active');
            navDrawer.classList.remove('open');
            navOverlay.classList.remove('show');
        });

        // Close menu on link click (navigation happens automatically)
        navLinks.forEach(link => {
            link.addEventListener('click', () => {
                navToggle.classList.remove('active');
                navDrawer.classList.remove('open');
                navOverlay.classList.remove('show');
            });
        });

        // Close menu on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                navToggle.classList.remove('active');
                navDrawer.classList.remove('open');
                navOverlay.classList.remove('show');
            }
        });

        // Update drawer active link based on current page
        function updateDrawerActiveLink() {
            const currentPage = window.location.pathname;
            document.querySelectorAll('.nav-drawer-link').forEach(link => {
                const href = link.getAttribute('href');
                if (href === currentPage || (currentPage === '/' && href === '/')) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        }
        updateDrawerActiveLink();
    </script>
</body>
</html>
