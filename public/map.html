<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAZI-EATS Terminal - Campus Food Map</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" /> />
    <style>
        /* Map-specific styles */
        body {
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
        }

        /* Full-screen map */
        #map {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            filter: brightness(0.9) contrast(1.1);
            pointer-events: auto;
            touch-action: pan-x pan-y;
            -webkit-tap-highlight-color: transparent;
            will-change: transform;
        }

        .leaflet-tile-container,
        .leaflet-map-pane,
        .leaflet-zoom-animated {
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
            will-change: transform;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        .leaflet-container a,
        .leaflet-container button,
        .filter-pill,
        .locate-btn,
        .search-box input {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        header, footer {
            display: none;
        }

        main {
            display: none;
        }
    </style>
</head>

<body class="map-page">
    <!-- Full-screen map -->
    <div id="map"></div>

    <!-- Floating search bar -->
    <div class="map-search">
        <div class="map-search-bar">
            <span class="material-symbols-rounded">search</span>
            <input type="text" id="mapSearch" placeholder=" Find Your Fav Spot" />
        </div>
    </div>

    <!-- Search results dropdown -->
    <div class="search-results" id="searchResults"></div>

    <!-- Category filter pills -->
    <div class="filter-pills" id="filterPills">
        <button class="filter-pill active" data-filter="all">All</button>
        <button class="filter-pill" data-filter="stores">Stores</button>
        <button class="filter-pill" data-filter="restaurants">Restaurants</button>
        <button class="filter-pill" data-filter="snacks">Snacks</button>
    </div>

    <!-- Floating action buttons -->
    <div class="fab-container">
        <button class="fab" id="locateBtn" title="Your location">
            <span class="material-symbols-rounded" id="locateIcon">location_searching</span>
        </button>

        <button class="fab" id="zoomInBtn" title="Zoom in">
            <span class="material-symbols-rounded">zoom_in</span>
        </button>

        <button class="fab" id="zoomOutBtn" title="Zoom out">
            <span class="material-symbols-rounded">zoom_out</span>
        </button>
    </div>

    <!-- Navigation tracking banner -->
    <div class="nav-banner" id="navBanner">
        <div class="nav-info">
            <div class="nav-destination" id="navDestination"></div>
            <div class="nav-details" id="navDetails"></div>
        </div>
        <button class="nav-stop-btn" id="navStopBtn">Stop</button>
    </div>

    <!-- Bottom sheet (place card) -->
    <div class="bottom-sheet" id="bottomSheet">
        <div class="sheet-handle"></div>

        <img class="sheet-image" id="sheetImage" src="" alt="Vendor image" loading="lazy" />

        <div class="sheet-content">
            <div class="sheet-header">
                <div class="sheet-title-group">
                    <div class="sheet-vendor-name" id="sheetVendorName"></div>
                    <div class="sheet-rating" id="sheetRating"></div>
                </div>
            </div>
            <div class="sheet-category" id="sheetCategory"></div>
            <div class="sheet-info-row">
                <span class="sheet-info-icon">📍</span>
                <span id="sheetLocation"></span>
            </div>
            <div class="sheet-info-row">
                <span class="sheet-info-icon">🕐</span>
                <span id="sheetHours"></span>
            </div>
            <div class="sheet-info-row">
                <span class="sheet-info-icon">💰</span>
                <span id="sheetPrice"></span>
            </div>
            <div class="sheet-info-row">
                <span class="sheet-info-icon">ℹ️</span>
                <span id="sheetDescription"></span>
            </div>
            <div class="sheet-actions">
                <button class="sheet-action-btn btn-directions" id="directionsBtn">🗺️ Get Directions</button>
                <button class="sheet-action-btn btn-share" id="shareBtn">📤 Share</button>
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Floating Navigation Bar -->
    <nav>
        <div class="nav-pill"> 
            <span class="routes home-page"> <a href="/" class="">Home </a></span>
            <span class="routes map-page"> <a href="/map" class="">Map </a></span>
            <span class="routes ai-advisor-page"> <a href="/healthy" class="">AI </a></span>
            <span class="routes chef-mode-page"> <a href="/recipe-builder" class="">Chef </a></span>    
        </div>
    </nav>

    <!-- Leaflet & Routing -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

   

    <!-- Navigation menu script -->
    <script src="/js/navigation.js"></script> 
    <!-- Map script -->
    <script src="/js/map.js"></script>
</body>
</html>
